<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    

    <div class="calculator">
        <h1>Students Marks Calculator </h1>

        <div class="card">
            <p>Tip: Endsum = 0 to see required marks</p>

            <input type="number" id="a1"
                placeholder="Assessment 1 (out of 25)">

            <input type="number" id="a2"
                placeholder="Assessment 2 (out of 25)">

            <input type="number" id="a3"
                placeholder="Assessment 3 (out of 25)">

                  <input type="number" id="a4"
                placeholder="Assessment 3 (out of 25)">

            <input type="number" id="endsem"
                placeholder="Endsem (out of 100)">

            <button onclick="calculate()">
                Calculate 
            </button>

            <div id="result"></div>
        </div>

        <footer>
            Made with for Students
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
